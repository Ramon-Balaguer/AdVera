  <path d="M58.5 25L60.6 28.6H56.4Z" stroke="#ff4fa3" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M46 5L47.8 8.1H44.2Z" stroke="#3d8bff" stroke-width="1.3" stroke-linejoin="round"/>
