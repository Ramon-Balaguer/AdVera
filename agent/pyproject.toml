[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "advera-agent"
version = "0.0.0"
description = "AdVera desktop Capture Agent: microphone and system audio as independent tracks"
requires-python = ">=3.11"
license = "Elastic-2.0"
dependencies = [
    "websockets>=12",
    "numpy>=1.26",
    # Windows capture: microphone via PortAudio, system playback via WASAPI loopback.
    "sounddevice>=0.4.6; sys_platform == 'win32'",
    "soundcard>=0.4.3; sys_platform == 'win32'",
    "pystray>=0.19; sys_platform == 'win32'",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
advera-agent = "advera_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["advera_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
