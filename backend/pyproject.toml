[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "advera-backend"
version = "0.1.0"
description = "AdVera self-hosted meeting intelligence API and workers"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pgvector>=0.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Heavy ASR runtime, installed only in the transcription worker image.
asr = [
    "whisperx>=3.1",
    "speechbrain>=1.0",
    "numpy>=1.26",
]
# BGE-M3 embeddings for the Brain worker (ADR 0001, brain-embeddings-provider.md).
brain = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "numpy>=1.26",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs TEST_DATABASE_URL (PostgreSQL + pgvector) and TEST_REDIS_URL"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy async runs the code after each await inside a greenlet; the default tracer on
# Python 3.12 (the one CI and the images use) loses it, which made CI measure 84% where 3.14 shows 91%.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 90
