name: advera

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: advera
      POSTGRES_PASSWORD: advera
      POSTGRES_DB: advera
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"  # loopback only: default credentials
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advera -d advera"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.11-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"  # loopback only: no authentication
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Alembic is the sole schema owner; the API never creates tables at startup.
  migrate:
    build: ../backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      DATABASE_URL: postgresql+asyncpg://advera:advera@postgres:5432/advera
      REDIS_URL: redis://redis:6379/0
      AUDIO_STORAGE_PATH: /data/meetings
      ASR_LIVE_PROVIDER: ${ASR_LIVE_PROVIDER:-whisperx}
      ASR_DEFINITIVE_PROVIDER: ${ASR_DEFINITIVE_PROVIDER:-faster-whisper}
      ASR_FALLBACK_PROVIDER: ${ASR_FALLBACK_PROVIDER:-whisperx}
      ASR_DEFINITIVE_MODEL: ${ASR_DEFINITIVE_MODEL:-small}
      ASR_LIVE_MODEL: ${ASR_LIVE_MODEL:-tiny}
      # CPU/int8 by default; compose.nvidia.yml switches to CUDA/float16.
      ASR_DEVICE: cpu
      ASR_COMPUTE_TYPE: int8
      DIARIZATION_PROVIDER: ${DIARIZATION_PROVIDER:-local}
      DIARIZATION_CACHE_DIR: /root/.cache/advera-models
      # LLM defaults; the Settings page overrides them in the shared runtime settings file.
      EMBEDDING_DEVICE: cpu
      EMBEDDING_CACHE_DIR: /root/.cache/advera-models
      LLM_BASE_URL: ${LLM_BASE_URL:-http://localhost:11434}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      RUNTIME_SETTINGS_PATH: /data/config/settings.json
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ../backend
    environment: *backend-env
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - meeting-data:/data/meetings
      - app-config:/data/config
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Definitive transcription worker (ADR 0008): consumes advera:transcription:jobs.
  transcription-worker:
    build:
      context: ../backend
      args:
        INSTALL_EXTRAS: "asr,brain"
    command: ["python", "-m", "app.transcription_worker"]
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - meeting-data:/data/meetings
      - app-config:/data/config
      - asr-models:/root/.cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Summary worker (docs/redis.md §2): consumes advera:summary:jobs; the LLM runs elsewhere.
  summary-worker:
    build: ../backend
    command: ["python", "-m", "app.summary_worker"]
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - meeting-data:/data/meetings
      - app-config:/data/config
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Brain worker (docs/redis.md §3-4): indexing and cited queries; BGE-M3 embeddings.
  brain-worker:
    build:
      context: ../backend
      args:
        INSTALL_EXTRAS: "asr,brain"
    command: ["python", "-m", "app.brain_worker"]
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - meeting-data:/data/meetings
      - app-config:/data/config
      - asr-models:/root/.cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build: ../frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  app-config:
  asr-models:
  postgres-data:
  redis-data:
  meeting-data:
