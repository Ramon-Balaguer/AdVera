# AdVera from the published images, for a machine with an NVIDIA GPU (CUDA transcription and
# embeddings). Nothing is built here, and the repository is not needed, only this file:
#   curl -fsSLO https://raw.githubusercontent.com/Ramon-Balaguer/AdVera/main/docker/compose.images-nvidia.yml
#   docker compose -f compose.images-nvidia.yml up -d --wait
# Open http://localhost:8080. ADVERA_TAG picks the version: `main` (the default) follows the main
# branch; a release such as `0.1.0` stays put (see docker/IMAGES.md). Needs the NVIDIA Container
# Toolkit. For development from source use compose.dev.yml.
name: advera

x-image: &api-image ghcr.io/ramon-balaguer/advera-api:${ADVERA_TAG:-main}
x-worker-image: &worker-image ghcr.io/ramon-balaguer/advera-worker-nvidia:${ADVERA_TAG:-main}

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://advera:advera@postgres:5432/advera
  REDIS_URL: redis://redis:6379/0
  AUDIO_STORAGE_PATH: /data/meetings
  ASR_LIVE_PROVIDER: ${ASR_LIVE_PROVIDER:-faster-whisper}
  ASR_DEFINITIVE_PROVIDER: ${ASR_DEFINITIVE_PROVIDER:-faster-whisper}
  ASR_FALLBACK_PROVIDER: ${ASR_FALLBACK_PROVIDER:-}
  # On GPU the definitive model defaults to large-v3 (see compose.nvidia.yml).
  ASR_DEFINITIVE_MODEL: ${ASR_DEFINITIVE_MODEL:-large-v3}
  ASR_LIVE_MODEL: ${ASR_LIVE_MODEL:-tiny}
  ASR_DEVICE: cuda
  ASR_COMPUTE_TYPE: float16
  DIARIZATION_PROVIDER: ${DIARIZATION_PROVIDER:-local}
  DIARIZATION_CACHE_DIR: /root/.cache/advera-models
  EMBEDDING_DEVICE: cuda
  EMBEDDING_CACHE_DIR: /root/.cache/advera-models
  LLM_BASE_URL: ${LLM_BASE_URL:-http://localhost:11434}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  RUNTIME_SETTINGS_PATH: /data/config/settings.json
  # Meeting bot (ADR 0026). Empty URL = no bot; the `bot` profile runs Vexa at vexa:8056.
  # The key is minted by vexa-key-init into the runtime settings; the webhook secret
  # must match the Vexa service below (change it).
  VEXA_BASE_URL: ${VEXA_BASE_URL:-}
  VEXA_API_KEY: ${VEXA_API_KEY:-}
  VEXA_WEBHOOK_SECRET: ${VEXA_WEBHOOK_SECRET:-advera-dev-vexa-webhook-secret}
  VEXA_SPEAKER_NAMES: ${VEXA_SPEAKER_NAMES:-false}

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: advera
      POSTGRES_PASSWORD: advera
      POSTGRES_DB: advera
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advera -d advera"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.11-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Alembic is the sole schema owner; the API never creates tables at startup.
  migrate:
    image: *api-image
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: *api-image
    environment: *backend-env
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - meeting-data:/data/meetings
      - app-config:/data/config
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  transcription-worker:
    image: *worker-image
    command: ["python", "-m", "app.transcription_worker"]
    restart: unless-stopped
    gpus: all
    environment: *backend-env
    volumes:
      - meeting-data:/data/meetings
      - app-config:/data/config
      - asr-models:/root/.cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  summary-worker:
    image: *api-image
    command: ["python", "-m", "app.summary_worker"]
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - meeting-data:/data/meetings
      - app-config:/data/config
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  brain-worker:
    image: *worker-image
    command: ["python", "-m", "app.brain_worker"]
    restart: unless-stopped
    gpus: all
    environment: *backend-env
    volumes:
      - meeting-data:/data/meetings
      - app-config:/data/config
      - asr-models:/root/.cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/ramon-balaguer/advera-frontend:${ADVERA_TAG:-main}
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
    depends_on:
      - api

  # ----- Meeting bot (ADR 0026): `docker compose --profile bot ...` ----------------------
  # Vexa Lite sends "AdVera Notekeeper" to Google Meet and Teams calls. It keeps its own
  # database in AdVera's PostgreSQL server (a separate `vexa` database and role, created by
  # vexa-db-init; pgvector is only enabled in `advera`) and its recordings in vexa-storage.
  # Vexa does not transcribe (TRANSCRIBE_ENABLED=false): AdVera transcribes the recording.
  # Its transcription is only needed to name speakers: add the `bot-names` profile and set
  # VEXA_SPEAKER_NAMES=true to run a Whisper for it.
  vexa-db-init:
    profiles: ["bot", "bot-names"]
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      PGHOST: postgres
      PGUSER: advera
      PGPASSWORD: advera
      PGDATABASE: advera
      VEXA_DB_PASSWORD: ${VEXA_DB_PASSWORD:-vexa}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'vexa'" | grep -q 1 \
          || psql -c "CREATE ROLE vexa LOGIN PASSWORD '$$VEXA_DB_PASSWORD'"
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'vexa'" | grep -q 1 \
          || psql -c "CREATE DATABASE vexa OWNER vexa"
    depends_on:
      postgres:
        condition: service_healthy

  vexa-storage:
    profiles: ["bot", "bot-names"]
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    restart: unless-stopped
    environment:
      ROOT_ACCESS_KEY: ${VEXA_STORAGE_ACCESS_KEY:-vexa-access-key}
      ROOT_SECRET_KEY: ${VEXA_STORAGE_SECRET_KEY:-vexa-secret-key}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /srv/vexa-storage/data /srv/vexa-storage/iam &&
        exec versitygw --port :9000 --health /health --iam-dir /srv/vexa-storage/iam
        --quiet posix /srv/vexa-storage/data
    volumes:
      - vexa-storage:/srv/vexa-storage

  vexa-storage-init:
    profiles: ["bot", "bot-names"]
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    environment:
      ADMIN_ACCESS_KEY: ${VEXA_STORAGE_ACCESS_KEY:-vexa-access-key}
      ADMIN_SECRET_KEY: ${VEXA_STORAGE_SECRET_KEY:-vexa-secret-key}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          out=$$(versitygw admin --endpoint-url http://vexa-storage:9000 create-bucket \
            --bucket vexa --owner "$$ADMIN_ACCESS_KEY" 2>&1) && exit 0
          echo "$$out" | grep -q BucketAlreadyOwnedByYou && exit 0
          sleep 1
        done
        echo "could not create the vexa bucket" >&2
        exit 1
    depends_on:
      - vexa-storage

  vexa:
    profiles: ["bot", "bot-names"]
    # Pinned by tag and digest: Vexa drives Google's and Microsoft's web clients, and a newer
    # build is a different integration. Upgrade on purpose (docs/features/meeting-bot-vexa.md).
    image: vexaai/vexa-lite:v0.12.27@sha256:945628e54d843cf6286a823ca8e226f2b3c48eb948ad2f895e64eb867b7a0d55
    restart: unless-stopped
    shm_size: 2g  # the bot's browser
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: vexa
      DB_USER: vexa
      DB_PASSWORD: ${VEXA_DB_PASSWORD:-vexa}
      ADMIN_TOKEN: ${VEXA_ADMIN_TOKEN:-advera-dev-vexa-admin}
      ADMIN_API_TOKEN: ${VEXA_ADMIN_TOKEN:-advera-dev-vexa-admin}
      RECORDING_ENABLED: "true"
      TRANSCRIBE_ENABLED: ${VEXA_SPEAKER_NAMES:-false}
      TRANSCRIPTION_SERVICE_URL: ${VEXA_TRANSCRIPTION_URL:-}
      TRANSCRIPTION_SERVICE_TOKEN: ${VEXA_TRANSCRIPTION_TOKEN:-}
      MINIO_ENDPOINT: vexa-storage:9000
      MINIO_ACCESS_KEY: ${VEXA_STORAGE_ACCESS_KEY:-vexa-access-key}
      MINIO_SECRET_KEY: ${VEXA_STORAGE_SECRET_KEY:-vexa-secret-key}
      MINIO_BUCKET: vexa
      MINIO_SECURE: "false"
      VEXA_PUBLIC_API_URL: http://vexa:8056
      # The operator callback reaches AdVera inside the Compose network (a user webhook would
      # be refused as a private address). Signed with the same secret AdVera checks.
      VEXA_SYSTEM_WEBHOOK_URL: http://api:8000/api/integrations/vexa/webhook
      VEXA_SYSTEM_WEBHOOK_SECRET: ${VEXA_WEBHOOK_SECRET:-advera-dev-vexa-webhook-secret}
      VEXA_SYSTEM_WEBHOOK_ALLOW_PRIVATE_HTTP: "true"
    ports:
      - "127.0.0.1:${VEXA_HOST_PORT:-8056}:8056"  # loopback only: the admin token is a dev default
    depends_on:
      vexa-db-init:
        condition: service_completed_successfully
      vexa-storage-init:
        condition: service_completed_successfully

  # Mints AdVera's Vexa API key through Vexa's admin API (it only listens inside the Vexa
  # container, hence the shared network namespace) and stores it with the Vexa URL in
  # AdVera's runtime settings. Idempotent: a key that still works is kept.
  vexa-key-init:
    profiles: ["bot", "bot-names"]
    image: vexaai/vexa-lite:v0.12.27@sha256:945628e54d843cf6286a823ca8e226f2b3c48eb948ad2f895e64eb867b7a0d55
    network_mode: "service:vexa"
    restart: "no"
    environment:
      ADMIN_API_TOKEN: ${VEXA_ADMIN_TOKEN:-advera-dev-vexa-admin}
      SETTINGS_PATH: /data/config/settings.json
      VEXA_BASE_URL: http://vexa:8056
    volumes:
      - app-config:/data/config
    entrypoint: ["python3", "-c"]
    command:
      - |
        import json, os, sys, time, urllib.error, urllib.request

        settings_path = os.environ["SETTINGS_PATH"]
        admin = os.environ["ADMIN_API_TOKEN"]
        email = "advera-notekeeper@example.com"


        def call(method, url, headers, body=None):
            data = json.dumps(body).encode() if body is not None else None
            request = urllib.request.Request(url, data=data, method=method, headers=headers)
            try:
                with urllib.request.urlopen(request, timeout=10) as response:
                    return response.status, response.read().decode()
            except urllib.error.HTTPError as error:
                return error.code, error.read().decode()
            except Exception:
                return 0, ""


        try:
            with open(settings_path, encoding="utf-8") as handle:
                current = json.load(handle)
        except (OSError, ValueError):
            current = {}
        key = current.get("vexa_api_key") or ""
        for _ in range(90):
            status, _body = call("GET", "http://127.0.0.1:8001/health", {})
            if status == 200:
                break
            time.sleep(2)
        if key:
            status, _body = call(
                "GET", "http://127.0.0.1:8056/meetings?limit=1", {"X-API-Key": key}
            )
            if status == 200:
                print("vexa-key-init: AdVera's Vexa key is valid")
                sys.exit(0)
        headers = {"X-Admin-API-Key": admin, "Content-Type": "application/json"}
        status, body = call("GET", "http://127.0.0.1:8001/admin/users/email/" + email, headers)
        if status != 200:
            status, body = call(
                "POST", "http://127.0.0.1:8001/admin/users", headers,
                {"email": email, "name": "AdVera"},
            )
        if status not in (200, 201):
            print("vexa-key-init: could not create the Vexa user: HTTP %s" % status)
            sys.exit(1)
        user_id = json.loads(body)["id"]
        status, body = call(
            "POST", "http://127.0.0.1:8001/admin/users/%s/tokens?scopes=bot,tx" % user_id, headers
        )
        token = json.loads(body).get("token") if status in (200, 201) else None
        if not token:
            print("vexa-key-init: could not mint a Vexa key: HTTP %s" % status)
            sys.exit(1)
        current["vexa_api_key"] = token
        current["vexa_base_url"] = current.get("vexa_base_url") or os.environ["VEXA_BASE_URL"]
        os.makedirs(os.path.dirname(settings_path), exist_ok=True)
        temporary = settings_path + ".vexa-key-init.tmp"
        with open(temporary, "w", encoding="utf-8") as handle:
            json.dump(current, handle, indent=2)
        os.chmod(temporary, 0o600)
        os.replace(temporary, settings_path)
        print("vexa-key-init: AdVera's Vexa key stored in the runtime settings")
    depends_on:
      vexa:
        condition: service_healthy

  # Only for speaker names (`--profile bot-names`, VEXA_SPEAKER_NAMES=true and
  # VEXA_TRANSCRIPTION_URL=http://vexa-whisper:8000): an OpenAI-compatible Whisper for Vexa.
  vexa-whisper:
    profiles: ["bot-names"]
    image: fedirz/faster-whisper-server:0.6.0-rc.3-cuda@sha256:913af07544138162ea0a0b38579821f2d1da567793bf97763e280932f574dd47
    gpus: all
    restart: unless-stopped
    environment:
      WHISPER__MODEL: ${VEXA_WHISPER_MODEL:-Systran/faster-whisper-small}
      WHISPER__INFERENCE_DEVICE: cuda
      WHISPER__TTL: "-1"
    volumes:
      - asr-models:/root/.cache

volumes:
  app-config:
  asr-models:
  postgres-data:
  redis-data:
  meeting-data:
  vexa-storage:
