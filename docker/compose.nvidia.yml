# NVIDIA override (nvidia-cuda-asr-runtime.md): faster-whisper on CUDA with float16.
# docker compose -f docker/compose.dev.yml -f docker/compose.nvidia.yml up -d --build
#
# On GPU the definitive model defaults to large-v3: the three-language smoke showed `small`
# misrecognizing Catalan and dropping short utterances (docs/features/rebuild-local-diarization.md).
# The API records the model on each job, so it must share the worker's ASR settings.
services:
  api:
    environment:
      ASR_DEFINITIVE_MODEL: ${ASR_DEFINITIVE_MODEL:-large-v3}

  transcription-worker:
    gpus: all
    environment:
      ASR_DEVICE: cuda
      ASR_COMPUTE_TYPE: float16
      ASR_DEFINITIVE_MODEL: ${ASR_DEFINITIVE_MODEL:-large-v3}

  brain-worker:
    gpus: all
    environment:
      EMBEDDING_DEVICE: cuda

  # Speaker names from the meeting bot (`--profile bot-names`): Vexa's Whisper on the GPU.
  vexa-whisper:
    image: fedirz/faster-whisper-server:0.6.0-rc.3-cuda@sha256:913af07544138162ea0a0b38579821f2d1da567793bf97763e280932f574dd47
    gpus: all
    environment:
      WHISPER__INFERENCE_DEVICE: cuda
