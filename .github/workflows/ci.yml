name: ci

on:
  push:
  pull_request:

# A newer push to the same branch replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_docs.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: advera
          POSTGRES_PASSWORD: advera
          POSTGRES_DB: advera
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U advera -d advera"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://advera:advera@localhost:5432/advera_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" -e "../agent"
      - run: ruff check .
      - run: ruff format --check .
      # The coverage gate (90%, pyproject.toml) applies here.
      - run: pytest --cov=app --junitxml=pytest.xml
      # Every test must have run: integration tests are skipped when the services are missing,
      # and a green run that skipped them would prove nothing.
      - run: python ../scripts/check_junit.py pytest.xml

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: advera
          POSTGRES_PASSWORD: advera
          POSTGRES_DB: advera
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U advera -d advera"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://advera:advera@localhost:5432/advera
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base
      - run: alembic upgrade head

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --junitxml=pytest.xml
      - run: python ../scripts/check_junit.py pytest.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: for file in landingpage/*.js; do node --check "$file"; done

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f docker/compose.dev.yml config --quiet
      - run: docker compose -f docker/compose.dev.yml -f docker/compose.nvidia.yml config --quiet

  # The one check that branch protection requires (docs/github-setup.md). It passes only when
  # every job above passed, tests included, so adding a job here never needs a change on GitHub.
  # A job that was skipped or cancelled counts as a failure.
  ci-passed:
    name: CI passed
    if: always()
    needs: [docs, backend, migrations, agent, frontend, landing, compose]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/ci_gate.py
        env:
          NEEDS: ${{ toJSON(needs) }}
